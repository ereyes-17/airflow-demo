name: CI-CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/*'
  
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Get changed files
        id: changed-files-build
        uses: tj-actions/changed-files@v45
        with:
          files: |
            Dockerfile
            requirements.txt
      - name: Setup Docker Buildx
        if: steps.changed-files-build.outputs.any_changed == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Log in to Dockerhub
        if: steps.changed-files-build.outputs.any_changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build and push Docker image
        if: steps.changed-files-build.outputs.any_changed == 'true'
        run: |
          docker buildx build --push \
          --tag ${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.DOCKERHUB_REPOSITORY }}:latest \
          --tag ${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.DOCKERHUB_REPOSITORY }}:${{ github.sha }} \
          .
  unit-and-integration-and-e2e-tests:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    env:
      API_KEY: ${{ secrets.API_KEY }}
      CHANNEL_HANDLE: ${{ vars.CHANNEL_HANDLE }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
      DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
      POSTGRES_CONN_USERNAME: ${{ vars.POSTGRES_CONN_USERNAME }}
      POSTGRES_CONN_PASSWORD: ${{ secrets.POSTGRES_CONN_PASSWORD }}
      POSTGRES_CONN_HOST: ${{ vars.POSTGRES_CONN_HOST }}
      POSTGRES_CONN_PORT: ${{ vars.POSTGRES_CONN_PORT }}
      METADATA_DATABASE_NAME: ${{ vars.METADATA_DATABASE_NAME }}
      METADATA_DATABASE_USERNAME: ${{ vars.METADATA_DATABASE_USERNAME }}
      METADATA_DATABASE_PASSWORD: ${{ secrets.METADATA_DATABASE_PASSWORD }}
      CELERY_BACKEND_NAME: ${{ vars.CELERY_BACKEND_NAME }}
      CELERY_BACKEND_USERNAME: ${{ vars.CELERY_BACKEND_USERNAME }}
      CELERY_BACKEND_PASSWORD: ${{ secrets.CELERY_BACKEND_PASSWORD }}
      ELT_DATABASE_NAME: ${{ vars.ELT_DATABASE_NAME }}
      ELT_DATABASE_USERNAME: ${{ vars.ELT_DATABASE_USERNAME }}
      ELT_DATABASE_PASSWORD: ${{ secrets.ELT_DATABASE_PASSWORD }}
      AIRFLOW_UID: ${{ vars.AIRFLOW_UID }}
      AIRFLOW_WWW_USER_USERNAME: ${{ vars.AIRFLOW_WWW_USER_USERNAME }}
      AIRFLOW_WWW_USER_PASSWORD: ${{ secrets.AIRFLOW_WWW_USER_PASSWORD }}
      FERNET_KEY: ${{ secrets.FERNET_KEY }}
      AIRFLOW__LOGGING__LOGGING_CONFIG_CLASS: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Get changed files
        id: changed-files-test
        uses: tj-actions/changed-files@v45
        with:
          files: |
            airflow/dags/*
            airflow/include/*
            docker-compose.yaml
      - name: Setup docker compose and wait for init
        if: steps.changed-files-test.outputs.any_changed == 'true'
        run: |
          docker compose up -d || {
            echo "docker compose up failed; dumping postgres logs..."
            docker compose logs postgres --tail 300
            exit 1
          }
          docker compose logs -f airflow-init &
          echo "Waiting for airflow-init to complete..."
          for i in {1..60}; do
            status=$(docker inspect --format='{{.State.ExitCode}}' airflow-init 2>/dev/null || echo "")
            if [[ "${status}" == "0" ]]; then
              echo "airflow-init completed successfully"
              break
            elif [[ "${status}" != "" && "${status}" != "0" ]]; then
              echo "airflow-init failed with exit code ${status}"
              docker logs airflow-init --tail 300
              exit 1
            fi
            sleep 5
          done
      - name: Run unit and integration tests
        if: steps.changed-files-test.outputs.any_changed == 'true'
        run: |
          docker exec -u root airflow-webserver sh -c "mkdir -p /opt/airflow/logs/dag_processor_manager /opt/airflow/logs/scheduler && chown -R ${AIRFLOW_UID}:0 /opt/airflow/logs"
          docker exec airflow-webserver sh -c "pytest tests/ -v"
      - name: Run e2e DAG tests
        if: steps.changed-files-test.outputs.any_changed == 'true'
        run: |
          DAG_NAMES=("produce_json" "update_db" "data_quality")
          for DAG in "${DAG_NAMES[@]}"; do
            docker exec airflow-webserver sh -c "airflow dags test $DAG"
          done
      - name: Tear down docker compose
        if: steps.changed-files-test.outputs.any_changed == 'true'
        run: docker compose down -v --remove-orphans
